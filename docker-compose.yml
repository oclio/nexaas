services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexaas-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '5455:5432'
    volumes:
      - nexaas-postgres-data:/var/lib/postgresql/data
      - ./docker/init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh
    networks:
      - nexaas-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  nexaas-network:
    name: nexaas-network
    driver: bridge

volumes:
  nexaas-postgres-data:
    name: nexaas-postgres-data
    driver: local
